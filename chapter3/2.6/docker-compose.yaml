services:
  frontend:
    image: example-frontend
    ports:
      - "5001:5001"
  backend:
    image: example-backend
    ports:
      - "8080:8080"
    environment:
      - REDIS_HOST=redis-db
      - POSTGRES_HOST=postgres-db
      - POSTGRES_USER=postgres
      - POSTGRES_PASSWORD=postgres
      - POSTGRES_DB=postgres
  
  redis-db:
    image: redis:latest
  
  postgres-db:
    image: postgres:latest
    restart: unless-stopped
    environment:
      - POSTGRES_USER=postgres
      - POSTGRES_PASSWORD=postgres
      - POSTGRES_DB=postgres